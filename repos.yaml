repos: {}
  - id: /*./
    allows_overrides: ["workflow"]
    pre_workflow_hooks:
      run: "cat ~/workspace/git/gitops-with-atlantis/atlantis.yaml > atlantis.yaml"
    apply_requirements: ["approved", "mergeable"]
    workflow: poc

workflows:
  poc:
    plan:
      steps:
        - init:
            extra_args: ["-upgrade"]
        - plan:
            extra_args: ["-var-file=tfvars/default.tfvars"]

    apply:
      steps:
        - apply
